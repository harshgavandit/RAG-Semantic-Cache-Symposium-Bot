[project]
name = "symposium-rag-bot"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "langchain-openai==0.2.14",
  "langchain-community==0.3.15",
  "langchain-text-splitters==0.3.11",
  "faiss-cpu==1.13.0",
  "numpy==2.5.4",
  "pypdf==5.1.0",
  "python-dotenv==1.0.1",
  "httpx==0.28.1"
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "python scripts/build_vercel.py"
